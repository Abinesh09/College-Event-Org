services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-campusconnect}
    ports:
      # Maps container port 5432 to host port 5433 by default to avoid conflict with local PostgreSQL
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-campusconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-campusconnect}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_campusconnect_2026}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      UPLOAD_DIR: ./uploads
      ALLOW_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
