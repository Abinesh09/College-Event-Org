    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes cursorMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(var(--tx, 100px), var(--ty, 100px)); }
    }
    @keyframes clickRipple {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .custom-scroll::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(20, 184, 166, 0.4);
      border-radius: 4px;
    }
  </style>
</head>

    <!-- Video Playback Controls Bar -->

          <div class="w-3 h-3 rounded-full bg-slate-900 border-2 border-slate-600"></div>
          <div class="w-3 h-3 rounded-full bg-slate-900 border-2 border-slate-600"></div>
          <div class="w-3 h-3 rounded-full bg-slate-900 border-2 border-slate-600"></div>
        </div>
      </div>

        <div class="flex items-center space-x-3">

          </button>

          </button>

            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>

          <!-- Replay -->
          <button onclick="restartVideo()" class="p-2 text-slate-400 hover:text-white transition-colors" title="Restart">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

        </div>

          url: "localhost/teacher/events/stats",
          badge: "Teacher Portal: Analytics & Reporting",

          render: () => `

    function renderScene() {
      const scene = tracks[currentTrack][currentSceneIdx];
      document.getElementById('videoStage').innerHTML = scene.render();
      document.getElementById('screenUrl').textContent = scene.url;
      document.getElementById('captionTitle').textContent = scene.title;
      document.getElementById('captionText').textContent = scene.caption;
      document.getElementById('roleIndicatorBadge').textContent = currentTrack === 'student' ? 'Student Mode' : 'Faculty Mode';

      // Update progress bar
      const totalScenes = tracks[currentTrack].length;
      const progressPercent = ((currentSceneIdx * SCENE_DURATION + sceneProgress) / (totalScenes * SCENE_DURATION)) * 100;
      document.getElementById('progressBar').style.width = progressPercent + '%';

      // Update timer display
      const currentSecs = Math.round(currentSceneIdx * SCENE_DURATION + sceneProgress);
      const totalSecs = totalScenes * SCENE_DURATION;
      document.getElementById('timeElapsed').textContent = formatTime(currentSecs);
      document.getElementById('timeTotal').textContent = formatTime(totalSecs);

      // Animate Cursor
      const cursor = document.getElementById('virtualCursor');
      if (scene.cursorAnim) {
        cursor.style.left = scene.cursorAnim.x;
        cursor.style.top = scene.cursorAnim.y;
        const pulse = document.getElementById('cursorPulse');
        pulse.classList.remove('hidden');
        setTimeout(() => pulse.classList.add('hidden'), 500);
      }

      // Update pills
      for (let i = 0; i < 4; i++) {
        const pill = document.getElementById(`pill${i}`);
        if (i === currentSceneIdx) {
          pill.className = "px-2.5 py-1 rounded-md text-[11px] font-semibold bg-teal-500/20 text-teal-300 border border-teal-500/30";
        } else {
          pill.className = "px-2.5 py-1 rounded-md text-[11px] font-semibold text-slate-400 hover:text-slate-200";
        }
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playIcon').classList.toggle('hidden', isPlaying);
      document.getElementById('pauseIcon').classList.toggle('hidden', !isPlaying);

      if (isPlaying) {
        startTimer();
      } else {
        clearInterval(timer);
      }
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(() => {
        sceneProgress += (0.1 * playbackSpeed);
        if (sceneProgress >= SCENE_DURATION) {
          sceneProgress = 0;
          if (currentSceneIdx < tracks[currentTrack].length - 1) {
            currentSceneIdx++;
          } else {
            // Loop or stop
            currentSceneIdx = 0;
          }
        }
        renderScene();
      }, 100);
    }

    function setTrack(track) {
      currentTrack = track;
      currentSceneIdx = 0;
      sceneProgress = 0;

      const btnStudent = document.getElementById('btnStudentTrack');
      const btnTeacher = document.getElementById('btnTeacherTrack');

      if (track === 'student') {
        btnStudent.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all text-white bg-teal-600 shadow-sm flex items-center space-x-1.5";
        btnTeacher.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center space-x-1.5";
      } else {
        btnTeacher.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all text-white bg-purple-600 shadow-sm flex items-center space-x-1.5";
        btnStudent.className = "px-3 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center space-x-1.5";
      }
      renderScene();
    }

    function nextScene() {
      sceneProgress = 0;
      if (currentSceneIdx < tracks[currentTrack].length - 1) {
        currentSceneIdx++;
      } else {
        currentSceneIdx = 0;
      }
      renderScene();
    }

    function prevScene() {
      sceneProgress = 0;
      if (currentSceneIdx > 0) {
        currentSceneIdx--;
      } else {
        currentSceneIdx = tracks[currentTrack].length - 1;
      }
      renderScene();
    }

    function jumpToScene(idx) {
      currentSceneIdx = idx;
      sceneProgress = 0;
      renderScene();
    }

    function restartVideo() {
      currentSceneIdx = 0;
      sceneProgress = 0;
      renderScene();
    }

    function cycleSpeed() {
      if (playbackSpeed === 1.0) playbackSpeed = 1.5;
      else if (playbackSpeed === 1.5) playbackSpeed = 2.0;
      else playbackSpeed = 1.0;
      document.getElementById('btnSpeed').textContent = playbackSpeed.toFixed(1) + 'x';
    }

    function downloadSelf() {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'CampusConnect_Video_Walkthrough.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Auto-start playback on initial load
    renderScene();
    togglePlay();
  </script>
